name: Security Audit

on:
  workflow_dispatch: # Allow manual triggering
  push:

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the baseline is scanned from a worktree

      - uses: Xevion/advisory-action@v1

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # Advisories are judged against the merge base in the job above. Source
      # and ban policy have no such time dependence, so they stay a plain gate.
      - name: Run cargo deny
        run: cargo deny --manifest-path src-tauri/Cargo.toml check sources bans --show-stats
